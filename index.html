<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Hand Evaluator RGB Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="rgb-card-container">
    <div class="main-card">
      <h1 class="glow-title">POKER EVALUATOR <span class="symbols">♠♥♣♦</span></h1>

      <!-- Section Kartu Tangan -->
      <div class="section">
        <h2>Kartu Tangan (Hole Cards)</h2>
        <div id="hand-cards" class="card-group"></div>
        <div class="sub-result">Kombinasi Tangan: <span id="hand-only-result" class="highlight">-</span></div>
      </div>

      <!-- Section Kartu Komunitas -->
      <div class="section">
        <h2>Kartu Komunitas (Board)</h2>
        <div id="community-cards" class="card-group"></div>
      </div>

      <div class="button-group">
        <button id="btn-deal" class="btn btn-rgb">🎲 Kocok & Bagi Acak</button>
      </div>

      <!-- Section Hasil Akhir Combined -->
      <div class="result-box">
        <h2>Kombinasi Tertinggi (Total 7 Kartu):</h2>
        <div id="result-name" class="glow-text">-</div>
        <div id="best-cards" class="card-group"></div>
      </div>
    </div>
  </div>

  <!-- Modal Pop-up untuk Memilih Kartu Manual -->
  <div id="card-picker-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Pilih Kartu</h3>
        <span id="close-modal" class="close-btn">&times;</span>
      </div>
      <div id="picker-grid" class="picker-grid"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
