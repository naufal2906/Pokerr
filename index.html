<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PKV AR Camera HUD Pro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- TOP BAR ALA MEJA PKV -->
    <header class="pkv-topbar">
      <div class="table-info">
        <span class="table-name">Table 51 • 9-Max</span>
        <span class="blind-pill">300 / 600</span>
      </div>
      <div class="pot-pill">
        <span>POT:</span>
        <input type="number" id="input-pot" value="1800" step="300" min="0">
      </div>
      <div class="top-actions">
        <button type="button" id="btn-cam-scan" class="btn-cam">📷 Kamera</button>
        <button type="button" id="btn-reset" class="btn-reset">Reset</button>
      </div>
    </header>

    <!-- ARENA MEJA PKV + KAMERA REAL-TIME -->
    <main class="pkv-table-arena" id="table-arena">
      <!-- Latar Kamera Belakang iOS (Aktif saat tombol Kamera ditekan) -->
      <video id="ar-camera-video" autoplay muted playsinline class="hidden"></video>
      <canvas id="ar-process-canvas" width="360" height="640" class="hidden"></canvas>

      <!-- Garis Bingkai Meja Lonjong PKV -->
      <div class="pkv-oval-felt"></div>

      <!-- KONTROL KALIBRASI KAMERA (MUNCUL SAAT KAMERA AKTIF) -->
      <div id="cam-toolbar" class="cam-toolbar hidden">
        <span id="scan-badge" class="scan-status">🔴 SCAN AKTIF</span>
        <button type="button" id="btn-toggle-calib" class="btn-mini">⚙️ Geser Kotak</button>
        <button type="button" id="btn-stop-cam" class="btn-mini danger">Tutup Cam</button>
      </div>

      <div id="calib-panel" class="calib-panel hidden">
        <div class="calib-item">
          <label>Tinggi Kartu Meja: <span id="lbl-comm-y">33%</span></label>
          <input type="range" id="slider-comm-y" min="20" max="55" step="0.5" value="33">
        </div>
        <div class="calib-item">
          <label>Tinggi Kartu Kita: <span id="lbl-hole-y">64%</span></label>
          <input type="range" id="slider-hole-y" min="48" max="82" step="0.5" value="64">
        </div>
      </div>

      <!-- 1. HUD ATAS MEJA: OUTS SISA KARTU DI LUAR MEJA -->
      <div class="hud-overlay-top">
        <div class="hud-mini-label">OUTS SISA KARTU (Tap jika mati):</div>
        <div id="hud-outs-chips" class="outs-row">
          <span class="muted">Arahkan kamera ke meja atau tap kartu</span>
        </div>
      </div>

      <!-- 2. TENGAH MEJA: KARTU KOMUNITAS (3 FLOP ATAS + 2 TURN/RIVER BAWAH) -->
      <div class="community-zone" id="comm-zone">
        <div class="zone-caption">
          <span id="stage-badge">PRE-FLOP</span> • <span id="current-hand-badge">-</span>
        </div>
        <div class="comm-row-top">
          <div class="pkv-card-slot" data-type="comm" data-index="0">F1</div>
          <div class="pkv-card-slot" data-type="comm" data-index="1">F2</div>
          <div class="pkv-card-slot" data-type="comm" data-index="2">F3</div>
        </div>
        <div class="comm-row-bottom">
          <div class="pkv-card-slot" data-type="comm" data-index="3">T</div>
          <div class="pkv-card-slot" data-type="comm" data-index="4">R</div>
        </div>
      </div>

      <!-- 3. BAWAH KARTU KOMUNITAS: PERSENTASE MEJA, TARGET KITA & KEPUTUSAN -->
      <div class="hud-overlay-mid">
        <div class="stat-line">
          <span class="badge-meja">MEJA</span>
          <span id="hud-board-pct" class="stat-text">Belum Ada Kartu Meja</span>
        </div>
        <div class="stat-line">
          <span class="badge-kita">KITA</span>
          <span id="hud-hero-target" class="stat-text cyan">Scan / Pilih 2 Kartu Tangan</span>
        </div>

        <!-- BARIS CEPAT BET LAWAN & KEPUTUSAN -->
        <div class="bet-control-strip">
          <div class="bet-input-wrap">
            <span>Bet Lawan:</span>
            <input type="number" id="input-bet" value="600" step="300" min="0">
          </div>
          <div class="quick-bets">
            <button type="button" class="qbet" data-bet="0">0</button>
            <button type="button" class="qbet" data-bet="600">600</button>
            <button type="button" class="qbet" data-bet="1800">1.8k</button>
            <button type="button" class="qbet" data-bet="6000">6k</button>
            <button type="button" class="qbet" data-bet="15000">All-In</button>
          </div>
        </div>

        <div id="decision-banner" class="decision-bar verdict-call">
          <strong id="decision-verdict">MENUNGGU KARTU</strong>
          <span id="decision-detail">Tekan 📷 Kamera untuk scan layar HP main</span>
        </div>
      </div>

      <!-- 4. KURSI BAWAH (HERO): 2 KARTU KITA -->
      <div class="hero-seat-zone" id="hole-zone">
        <div class="hero-cards">
          <div class="pkv-card-slot active-slot" data-type="hole" data-index="0">?</div>
          <div class="pkv-card-slot" data-type="hole" data-index="1">?</div>
        </div>
        <div class="hero-plate">HERO (KURSI KITA)</div>
      </div>
    </main>

    <!-- KEYPAD KOREKSI MANUAL / CEPAT DI BAGIAN BAWAH -->
    <footer class="keypad-dock">
      <div class="suit-bar" id="suit-tabs">
        <button type="button" class="suit-btn active" data-suit="♠">♠</button>
        <button type="button" class="suit-btn red" data-suit="♥">♥</button>
        <button type="button" class="suit-btn" data-suit="♣">♣</button>
        <button type="button" class="suit-btn red" data-suit="♦">♦</button>
      </div>
      <div class="rank-bar" id="rank-grid"></div>
    </footer>
  </div>

  <script src="evaluator.js"></script>
  <script src="app.js"></script>
</body>
</html>
