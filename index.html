<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Evaluator Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="rgb-card-container">
    <div class="main-card">
      <h1 class="glow-title">POKER EVALUATOR <span class="symbols">♠♥♣♦</span></h1>

      <!-- Section Kartu Tangan -->
      <div class="section">
        <div class="section-header">
          <h2>Kartu Tangan Anda (Hole Cards)</h2>
          <button id="btn-open-hand" class="btn-add">+ Tangan</button>
        </div>
        <div id="hand-cards" class="card-group"></div>
        
        <div class="status-box">
          <div>Kombinasi Tangan Anda: <span id="my-best-hand" class="highlight-green">-</span></div>
          <div class="strength-meter-inline">
            <span>Win Equity:</span>
            <div class="progress-bar-bg">
              <div id="strength-bar" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <span id="strength-percent" class="percent-text">0%</span>
          </div>
        </div>
      </div>

      <!-- Section Kartu Komunitas -->
      <div class="section">
        <div class="section-header">
          <h2>Kartu Komunitas (Board)</h2>
          <button id="btn-open-comm" class="btn-add">+ Komunitas</button>
        </div>
        <div id="community-cards" class="card-group"></div>
        
        <div class="status-box board-status">
          <div>Kombinasi Murni Meja: <span id="board-only-hand" class="highlight-yellow">-</span></div>
        </div>
      </div>

      <!-- Section Analisis Potensi & Ancaman Meja -->
      <div class="result-box">
        <h2>Analisis Potensi & Ancaman Meja (Board Threat):</h2>
        <div id="board-threats" class="potential-list">
          <!-- Peringatan potensi flush/straight/full house lawan akan tampil di sini -->
        </div>

        <hr class="divider">

        <h2>Kombinasi Final 5 Kartu Terbaik Anda:</h2>
        <div id="result-name" class="glow-text">-</div>
        <div id="best-cards" class="card-group"></div>
      </div>
    </div>
  </div>

  <!-- Modal Picker (Simbol -> Nilai) -->
  <div id="card-picker-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Pilih Kartu (<span id="target-label">Tangan</span>)</h3>
        <span id="close-modal" class="close-btn">&times;</span>
      </div>
      
      <div class="picker-step">
        <label>1. Pilih Simbol:</label>
        <div class="suit-selector">
          <button class="btn-suit black" data-suit="SPADES">♠ Sekop</button>
          <button class="btn-suit red" data-suit="HEARTS">♥ Hati</button>
          <button class="btn-suit black" data-suit="CLUBS">♣ Keriting</button>
          <button class="btn-suit red" data-suit="DIAMONDS">♦ Wajik</button>
        </div>
      </div>

      <div id="rank-step" class="picker-step hidden">
        <label>2. Pilih Nilai Kartu:</label>
        <div id="rank-grid" class="rank-grid"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
