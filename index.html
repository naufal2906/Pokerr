<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Evaluator Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="rgb-card-container">
    <div class="main-card">
      <h1 class="glow-title">POKER EVALUATOR <span class="symbols">♠♥♣♦</span></h1>

      <!-- Section Kartu Tangan -->
      <div class="section">
        <div class="section-header">
          <h2>Kartu Tangan Anda (Hole Cards)</h2>
          <div class="btn-actions">
            <button id="btn-clear-hand" class="btn-clear">Reset</button>
          </div>
        </div>
        <!-- 2 Slot Kartu Tangan -->
        <div id="hand-cards" class="card-group"></div>
        
        <div class="status-box">
          <div>Kombinasi Kartu Tangan: <span id="hole-only-hand" class="highlight-cyan">-</span></div>
          <div>Kombinasi Tangan + Meja: <span id="my-best-hand" class="highlight-green">-</span></div>
          <div class="strength-meter-inline">
            <span>Win Equity:</span>
            <div class="progress-bar-bg">
              <div id="strength-bar" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <span id="strength-percent" class="percent-text">0%</span>
          </div>
        </div>
      </div>

      <!-- Section Kartu Komunitas -->
      <div class="section">
        <div class="section-header">
          <h2>Kartu Komunitas (Board)</h2>
          <div class="btn-actions">
            <button id="btn-clear-comm" class="btn-clear">Reset</button>
          </div>
        </div>
        <!-- 5 Slot Kartu Komunitas -->
        <div id="community-cards" class="card-group"></div>
      </div>

      <!-- Section Analisis Potensi & Counter Kartu Terkuat -->
      <div class="result-box">
        <h2>Analisis Potensi & Counter Kartu Terkuat (The Nuts):</h2>
        <div id="board-threats" class="potential-list"></div>

        <hr class="divider">

        <h2>Kombinasi Final Terbaik saat Ini:</h2>
        <div id="result-name" class="glow-text">-</div>
        <div id="best-cards" class="card-group"></div>
      </div>
    </div>
  </div>

  <!-- Modal Picker 4 Baris Simbol (Instant Selection) -->
  <div id="card-picker-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Pilih Kartu (<span id="target-label">Tangan</span>)</h3>
        <span id="close-modal" class="close-btn">&times;</span>
      </div>
      
      <!-- Grid 4 Baris Simbol -->
      <div id="full-card-grid" class="full-card-grid"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
