<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Poker Odds</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 30px auto; padding: 20px; background: #121212; color: #fff; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: none; box-sizing: border-box; }
        input, select { background: #2a2a2a; color: #fff; }
        button { background: #28a745; color: white; font-weight: bold; margin-top: 15px; cursor: pointer; }
        button:hover { background: #218838; }
        .result { margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; font-size: 1.1em; font-weight: bold; }
        .call { background: #155724; color: #d4edda; }
        .fold { background: #721c24; color: #f8d7da; }
    </style>
</head>
<body>

<div class="card">
    <h2>Poker Odds Calculator</h2>
    
    <label>Jumlah Outs:</label>
    <input type="number" id="outs" placeholder="Contoh: 8" min="1" max="20">

    <label>Ronde Saat Ini:</label>
    <select id="stage">
        <option value="4">Flop (Aturan x4)</option>
        <option value="2">Turn (Aturan x2)</option>
    </select>

    <label>Isi Pot Saat Ini ($):</label>
    <input type="number" id="pot" placeholder="Contoh: 100">

    <label>Biaya Call ($):</label>
    <input type="number" id="call" placeholder="Contoh: 20">

    <button onclick="calculateOdds()">Hitung Keputusan</button>

    <div id="output" class="result" style="display:none;"></div>
</div>

<script>
function calculateOdds() {
    const outs = parseFloat(document.getElementById('outs').value);
    const multiplier = parseFloat(document.getElementById('stage').value);
    const currentPot = parseFloat(document.getElementById('pot').value);
    const callAmount = parseFloat(document.getElementById('call').value);

    if (isNaN(outs) || isNaN(currentPot) || isNaN(callAmount)) {
        alert("Harap isi semua kolom angka!");
        return;
    }

    // Hitung Peluang Menang & Pot Odds
    const winProb = outs * multiplier;
    const totalPotAfterCall = currentPot + callAmount;
    const costPercent = (callAmount / totalPotAfterCall) * 100;

    const isWorth = winProb > costPercent;
    const recommendation = isWorth ? "CALL" : "FOLD";
    
    const outputDiv = document.getElementById('output');
    outputDiv.style.display = "block";
    outputDiv.className = "result " + (isWorth ? "call" : "fold");
    
    outputDiv.innerHTML = `
        Peluang Menang: ${winProb}%<br>
        Biaya Taruhan: ${costPercent.toFixed(1)}%<br>
        <hr>
        Rekomendasi: <strong>${recommendation}</strong>
    `;
}
</script>

</body>
</html>
