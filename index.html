<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Hand Evaluator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Poker Hand Evaluator ♠♥♣♦</h1>
    
    <div class="board">
      <div class="section">
        <h2>Kartu Tangan (Hole Cards)</h2>
        <div id="hand-cards" class="card-group"></div>
      </div>

      <div class="section">
        <h2>Kartu Komunitas (Board)</h2>
        <div id="community-cards" class="card-group"></div>
      </div>
    </div>

    <button id="btn-deal">Kocok & Bagi Kartu</button>

    <div class="result-box">
      <h2>Kombinasi Tertinggi:</h2>
      <div id="result-name">-</div>
      <div id="best-cards" class="card-group"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
